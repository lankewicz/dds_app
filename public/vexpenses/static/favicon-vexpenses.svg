<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Credit Card outline -->
  <rect x="96" y="128" width="320" height="256" rx="24" fill="url(#vexGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  <!-- Card stripe -->
  <rect x="96" y="176" width="320" height="48" fill="#047857" />
  <!-- Golden Chip/Emblem -->
  <rect x="136" y="256" width="64" height="48" rx="8" fill="url(#goldGrad)" />
  <!-- Stylized V for VExpenses -->
  <path d="M280 240l35 60 35-60" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Coin symbol overlapping in bottom-right -->
  <circle cx="370" cy="310" r="50" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6" />
  <!-- Dollar sign inside coin -->
  <text x="370" y="328" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">S</text>
  <line x1="370" y1="270" x2="370" y2="350" stroke="#ffffff" stroke-width="6" />
</svg>
