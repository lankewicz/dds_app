<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Line chart grid lines -->
  <line x1="120" y1="380" x2="400" y2="380" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <line x1="120" y1="140" x2="120" y2="380" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <!-- Upward Trend Line -->
  <path d="M120 340l80-60 60 30 120-140" fill="none" stroke="url(#trendGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow Head -->
  <path d="M320 170h60v60" fill="none" stroke="url(#trendGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Glowing points -->
  <circle cx="200" cy="280" r="16" fill="#ffffff" />
  <circle cx="260" cy="310" r="16" fill="#ffffff" />
  <circle cx="380" cy="170" r="20" fill="#ffffff" />
</svg>
