<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Monitor grid or circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#monitorGrad)" stroke-width="24" stroke-opacity="0.3" />
  <!-- Bar chart elements -->
  <rect x="156" y="260" width="40" height="120" rx="12" fill="#ffffff" />
  <rect x="236" y="180" width="40" height="200" rx="12" fill="url(#monitorGrad)" />
  <rect x="316" y="220" width="40" height="160" rx="12" fill="#34d399" />
  <!-- A glowing checkmark or pulse line overlapping -->
  <path d="M120 220l80 80 180-180" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
</svg>
