<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso negado | {{ app_title }}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:#f8fafc;font-family:Inter,sans-serif">
  <main style="max-width:560px;padding:36px;background:white;border:1px solid #e2e8f0;border-radius:16px;text-align:center;box-shadow:0 12px 35px rgba(15,23,42,.08)">
    <div style="font-size:52px">🔒</div>
    <h1>Acesso não autorizado</h1>
    <p>O usuário <strong>{{ user_email }}</strong> não possui acesso a <strong>{{ permission_name }}</strong>.</p>
    <p>Solicite a um administrador a liberação dessa área.</p>
    <a href="/" style="display:inline-block;margin-top:12px;padding:10px 18px;background:#2563eb;color:white;border-radius:8px;text-decoration:none">Voltar ao portal</a>
  </main>
</body>
</html>
